<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dateo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e4dc;--bg2:#ecd5ca;--card:#fffaf5;--ink:#3b1420;--soft:#8a6470;--gold:#b08445;--line:#e6d0c3;--btn:#4a1626;--btnink:#fbeee4;--ok:#3f9b6b;--wait:#d9a03a;--bad:#c0414f}
@media (prefers-color-scheme:dark){:root{--bg:#150a0e;--bg2:#241119;--card:#241119;--ink:#f6e6dc;--soft:#b99aa4;--gold:#d4ad6a;--line:#3d1f2b;--btn:#d4ad6a;--btnink:#2a1219}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 70% at 50% -8%,var(--bg2),var(--bg)) fixed;color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:440px;margin:0 auto;padding:22px 18px 44px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.brand{font-family:Fraunces,serif;font-weight:600;font-size:27px;letter-spacing:.01em}
.brand small{display:block;font:400 13px 'Hanken Grotesk';color:var(--soft);letter-spacing:.02em}
.pill{border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;background:var(--card)}
.pill.st{display:inline-flex;margin:2px 0 14px}
.dot{width:9px;height:9px;border-radius:50%;background:#b9a7a0;display:inline-block}
.dot.on{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:36px 24px 28px;text-align:center;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 22px 44px -22px rgba(74,22,38,.4)}
.orn{width:30px;height:30px;color:var(--gold);display:block;margin:0 auto 16px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:29px;line-height:1.18;letter-spacing:-.01em;margin:0 0 10px}
p{color:var(--soft);margin:0 0 18px;line-height:1.55;font-size:15.5px}
.btn{display:block;width:100%;border:0;border-radius:99px;min-height:54px;padding:14px;font:700 16px 'Hanken Grotesk';letter-spacing:.02em;background:var(--btn);color:var(--btnink);margin-top:12px;cursor:pointer;box-shadow:0 10px 20px -10px rgba(74,22,38,.65)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--gold);box-shadow:none}
.btn:disabled{opacity:.4;box-shadow:none}
.btn:focus-visible,.k:focus-visible,.act:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.dots{display:flex;gap:18px;justify-content:center;margin:20px 0 28px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold)}
.dots i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px;justify-content:center}
.k{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:400 31px Fraunces,serif;cursor:pointer}
.k:active{background:var(--bg2);border-color:var(--gold)}
.k.x{border:0;font-size:22px;color:var(--soft)}
input[type=date],input[type=time],.fld{width:100%;font:600 20px 'Hanken Grotesk';padding:15px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
.act{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px 14px;text-align:left;color:var(--ink);cursor:pointer;font-family:inherit}
.act b{display:block;font:600 19px Fraunces,serif;margin-bottom:6px}
.act small{display:block;color:var(--soft);font-size:13px;line-height:1.4}
.act.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);background:var(--bg2)}
.act:disabled{opacity:.85}
.lights{display:flex;gap:14px;justify-content:center;margin:16px 0}
.lights i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line)}
.lights i.g.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px var(--ok)}
.lights i.y.on{background:var(--wait);border-color:var(--wait);box-shadow:0 0 14px var(--wait)}
.lights i.r.on{background:var(--bad);border-color:var(--bad);box-shadow:0 0 14px var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;max-width:90%;text-align:center;z-index:9}
.link{background:none;border:0;color:var(--soft);font:600 14px 'Hanken Grotesk';margin-top:18px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tk{display:flex;margin:20px 0 10px;filter:drop-shadow(0 14px 18px rgba(59,20,32,.35));text-align:left}
.tk .m{flex:1;background:linear-gradient(140deg,#5c1b30,#34111d 75%);color:#f6e6dc;border-radius:16px 0 0 16px;padding:20px 18px;position:relative;min-height:176px;-webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.tk .m::after{content:"";position:absolute;inset:8px 4px 8px 12px;border:1px solid rgba(212,173,106,.5);border-radius:10px;pointer-events:none}
.tk .t{font:600 25px/1.1 Fraunces,serif;padding-left:4px}
.tk .t b{display:block;font:500 13px 'Hanken Grotesk';color:#d4ad6a;margin-bottom:6px}
.tk .vip{display:inline-block;border:1px solid #d4ad6a;color:#d4ad6a;border-radius:99px;padding:5px 14px;font-weight:700;font-size:11.5px;letter-spacing:.08em;margin:14px 0 12px 4px}
.tk .vip span{font-weight:500}
.tk .d{font-size:13px;line-height:1.6;font-weight:500;padding-left:4px;opacity:.92}
.tk .s{width:100px;background:#fffaf5;color:#3b1420;border-radius:0 16px 16px 0;border-left:2px dashed #dcc3b3;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tk .s svg{width:68px;height:68px}
.tk .c{font:600 20px Fraunces,serif;letter-spacing:.18em;color:#4a1626}
.tk .s small{font-weight:600;font-size:10px;color:#8a6470;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Dateo<small>a private invitation</small></div>
    <div class="pill"><span class="dot" id="net"></span><span id="netl">Offline</span></div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAAMCNjTZ7zdmw8WvwEIzbmDJDZz9fcwvs",
  authDomain: "dokito-a.firebaseapp.com",
  projectId: "dokito-a",
  storageBucket: "dokito-a.firebasestorage.app",
  messagingSenderId: "1023884219045",
  appId: "1:1023884219045:web:d44888e21a3ed4c4bcb34c",
  measurementId: "G-VNWZB90C7T"
};
const db = getFirestore(initializeApp(firebaseConfig));

const $ = s => document.querySelector(s), app = $('#app');
const ACTS = {
  coffee: ['Coffee', 'Slow, warm, easy to linger'],
  pastry: ['Pastry', 'Something sweet to share'],
  photo: ['Photo', 'Golden hour and a camera'],
  fuchka: ['Doi fuchka', 'Street-side, tangy, a little messy']
};
const S = { role: null, code: null, view: 'home', room: null, ref: null, unsub: null, seen: false, pin: '', busy: false };
try { S.role = sessionStorage.getItem('role'); S.code = sessionStorage.getItem('code'); } catch (e) {}

const other = r => r === 'c' ? 'g' : 'c';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = d => esc(new Date(d + 'T00:00').toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }));
const fmtTime = t => esc(new Date('2000-01-01T' + t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));

function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3500); }
function errMsg(e) {
  const c = (e && e.code) || '';
  if (c === 'permission-denied') return 'The database blocked this. Publish the Firestore rules.';
  if (c === 'unavailable') return 'No connection. Check your internet and try again.';
  if (c === 'not-found') return 'Not found. If this repeats, create the Firestore database in the Firebase console.';
  return 'Something went wrong. Try again.';
}
async function run(fn) { try { await fn(); } catch (e) { console.error(e); toast(errMsg(e)); } }
const upd = o => updateDoc(S.ref, o);
const act = o => run(() => upd(o));

function setNet() {
  const on = navigator.onLine;
  $('#net').classList.toggle('on', on);
  $('#netl').textContent = !on ? 'Offline' : S.code ? 'Room ' + S.code : 'Online';
}
addEventListener('online', setNet); addEventListener('offline', setNet);

// ---------- room lifecycle ----------
function detach() { if (S.unsub) S.unsub(); S.unsub = null; S.ref = null; }
function attach() {
  detach();
  S.seen = false;
  S.ref = doc(db, 'rooms', S.code);
  S.unsub = onSnapshot(S.ref, snap => {
    if (snap.exists()) {
      S.seen = true; S.room = snap.data();
      const r = S.room;
      if (r.stage === 'ticket' && r.ci && r.ci.c && r.ci.g) upd({ stage: 'active' }).catch(() => {});
      render();
    } else if (S.seen) { toast('Room closed'); leave(); }
    else if (!snap.metadata.fromCache) { toast('That room no longer exists.'); leave(); }
  }, e => { console.error(e); toast(errMsg(e)); });
}
function begin(role, code) {
  S.role = role; S.code = code; S.room = null;
  try { sessionStorage.setItem('role', role); sessionStorage.setItem('code', code); } catch (e) {}
  attach(); render();
}
function leave() {
  detach(); S.role = null; S.code = null; S.room = null; S.view = 'home'; S.pin = '';
  try { sessionStorage.removeItem('role'); sessionStorage.removeItem('code'); } catch (e) {}
  render();
}
async function create(c) {
  const r = doc(db, 'rooms', c), s = await getDoc(r);
  if (s.exists() && Date.now() - (s.data().created || 0) < 864e5) { toast('That room ID is taken. Try another.'); return render(); }
  await setDoc(r, { stage: 'date', created: Date.now(), joined: false });
  begin('c', c);
}
async function join(c) {
  const r = doc(db, 'rooms', c), s = await getDoc(r);
  if (!s.exists()) { toast('No room with that ID.'); return render(); }
  if (s.data().joined) { toast('This room already has two people.'); return render(); }
  await updateDoc(r, { joined: true });
  begin('g', c);
}

// ---------- ticket ----------
function qr(seed) {
  let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  let out = '', n = 11, u = 100 / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fin = (x < 3 && y < 3) || (x > n - 4 && y < 3) || (x < 3 && y > n - 4);
    h = (h * 1664525 + 1013904223) >>> 0;
    if (fin || (h >>> 16) % 2) out += `<rect x="${x * u}" y="${y * u}" width="${u}" height="${u}" fill="#3b1420"/>`;
  }
  return `<svg viewBox="0 0 100 100">${out}</svg>`;
}
function ticket(r, me) {
  const code = me === 'c' ? r.tc : r.tg, a = ACTS[r.act] || ['Date', ''], t = (r.t && r.t.c) || '';
  return `<div class="tk"><div class="m"><div class="t"><b>Date ticket</b>${me === 'c' ? 'Admit host' : 'Admit guest'}</div>
  <div class="vip">VIP <span>EXPERIENCE</span></div>
  <div class="d">${fmtDate(r.date)}<br>${t ? fmtTime(t) : ''}<br>${esc(a[0])} date</div></div>
  <div class="s">${qr(String(code) + r.date)}<div class="c">${esc(code)}</div><small>TICKET CODE</small></div></div>`;
}

// ---------- screens ----------
const orn = '<svg class="orn" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
const card = h => `<div class="card">${h}</div>`;
const close = '<button class="link" data-a="close">Close room</button>';
const pill = (c, t) => `<div class="pill st"><span class="dot" style="background:var(--${c})"></span>${t}</div>`;

function pad(title, sub) {
  return card(`<h1>${title}</h1><p>${sub}</p><div class="dots">${[0, 1, 2, 3].map(i => `<i class="${i < S.pin.length ? 'f' : ''}"></i>`).join('')}</div>
  <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="k" data-a="key" data-n="${n}">${n}</button>`).join('')}<span></span><button class="k" data-a="key" data-n="0">0</button><button class="k x" data-a="key" data-n="x" aria-label="Delete">⌫</button></div>
  <button class="link" data-a="back">Back</button>`);
}

function screen() {
  const me = S.role, r = S.room;
  if (!me) {
    if (S.view === 'create') return pad('Pick a room ID', 'Choose 4 digits and share them only with your crush.');
    if (S.view === 'join') return pad('Enter room ID', 'Your 4-digit code opens the invite.');
    return card(`${orn}<h1>Someone has a question for you</h1><p>Create a room to invite your crush, or enter the ID you were given.</p>
      <button class="btn" data-a="go-create">Create a room</button><button class="btn alt" data-a="go-join">I have a room ID</button>`);
  }
  if (!r) return card('<p>Connecting…</p>');
  const st = r.stage;

  if (st === 'date') {
    return me === 'c'
      ? card(`<h1>Pick the date</h1><p>Room <b>${esc(S.code)}</b>. Choose the day you want to ask about.</p><input type="date" id="dt" min="${today()}"><button class="btn" data-a="send-date">Send invite</button>${close}`)
      : card(`${orn}<h1>Almost ready</h1><p>The invite is being written. This page updates by itself.</p>`);
  }
  if (st === 'invite') {
    return me === 'g'
      ? card(`${orn}<h1>Would you like to go on a date on ${fmtDate(r.date)}?</h1><p>No pressure, just a question.</p><button class="btn" data-a="yes">Yes, I would</button><button class="btn alt" data-a="no">Not this time</button>`)
      : card(`${orn}<h1>Invite sent</h1><p>Share room ID <b>${esc(S.code)}</b> with your crush. Waiting for their answer for ${fmtDate(r.date)}.</p>${close}`);
  }
  if (st === 'time') {
    const t = r.t || {}, a = t.c || '', b = t.g || '', both = a && b, same = both && a === b, bad = both && a !== b;
    const mine = t[me] || '', theirs = t[other(me)] || '';
    return card(`<h1>Pick a time</h1><p>${fmtDate(r.date)}. Propose a time, or match theirs.</p>
      <div class="lights"><i class="g ${same ? 'on' : ''}"></i><i class="y ${!both ? 'on' : ''}"></i><i class="r ${bad ? 'on' : ''}"></i></div>
      <p><b>${same ? 'Time matched' : bad ? 'Times differ, adjust one' : 'Waiting for both times'}</b></p>
      <input type="time" id="tm" value="${esc(mine)}"><button class="btn alt" data-a="save-time">Propose this time</button>
      ${theirs && !same ? `<p style="margin-top:16px">They proposed <b>${fmtTime(theirs)}</b></p><button class="btn alt" data-a="match-time">Match their time</button>` : ''}
      <button class="btn" data-a="next-time" ${same ? '' : 'disabled'}>Continue</button>`);
  }
  if (st === 'activity') {
    const sel = r.act || '';
    return card(`<h1>What kind of date?</h1><p>${me === 'g' ? 'Pick your favourite.' : 'They are choosing. You can see it live.'}</p>
      <div class="grid">${Object.entries(ACTS).map(([k, [l, t]]) => `<button class="act ${sel === k ? 'sel' : ''}" data-a="pick" data-k="${k}" ${me === 'g' ? '' : 'disabled'}><b>${l}</b><small>${t}</small></button>`).join('')}</div>
      <button class="btn" data-a="confirm" ${sel && me === 'g' ? '' : 'disabled'}>Confirm and get tickets</button>`);
  }
  if (st === 'ticket' || st === 'active') {
    const on = st === 'active', done = r.ci && r.ci[me];
    return card(`<h1>${on ? 'The date is on' : 'Your tickets are ready'}</h1>${on ? pill('ok', 'Status: Active') : pill('wait', 'Status: Waiting for check-in')}
      ${ticket(r, me)}
      ${on
        ? `<p>Have a lovely time.</p>${me === 'g' ? '<button class="btn" data-a="perfect">It was a perfect date</button><button class="btn alt" data-a="nomatch">Not a match</button>' : '<p>Your date will tell you how it went.</p>'}`
        : `<p>${done ? 'You are checked in. Waiting for your date.' : 'At the date, ask for your date’s ticket code and enter it here.'}</p>
           ${done ? '' : '<input type="text" inputmode="numeric" maxlength="4" id="cc" class="fld" placeholder="Their 4-digit code" autocomplete="off"><button class="btn" data-a="checkin">Check in</button>'}`}
      <button class="link" data-a="cancel">Cancel date</button>`);
  }
  if (st === 'done') {
    const m = r.outcome === 'match', label = m ? 'Completed' : r.why === 'cancelled' ? 'Cancelled' : r.why === 'declined' ? 'Declined' : 'Ended';
    return card(`${orn}${pill(m ? 'ok' : 'bad', 'Date status: ' + label)}<h1>${m ? 'Perfect Match (Accepted)' : 'Try Next Time'}</h1>
      <p>${m ? 'You both wanted this one. Go enjoy it.' : 'Not this time, and that is okay. Be kind to yourself.'}</p>
      <button class="btn" data-a="close">Close room and delete everything</button>`);
  }
  return card('<p>Something unexpected happened.</p><button class="btn" data-a="close">Close room</button>');
}

function render() {
  setNet();
  const f = document.activeElement; let keep = null;
  if (f && app.contains(f) && f.tagName === 'INPUT' && f.id) keep = { id: f.id, v: f.value };
  app.innerHTML = screen();
  if (keep) { const i = document.getElementById(keep.id); if (i) { i.value = keep.v; i.focus(); } }
}

// ---------- actions ----------
const H = {
  'go-create'() { S.view = 'create'; S.pin = ''; render(); },
  'go-join'() { S.view = 'join'; S.pin = ''; render(); },
  back() { S.view = 'home'; S.pin = ''; render(); },
  key(b) {
    if (S.busy) return;
    const n = b.dataset.n;
    if (n === 'x') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += n;
    render();
    if (S.pin.length === 4) {
      const p = S.pin, v = S.view; S.pin = ''; S.busy = true;
      setTimeout(async () => { await run(() => v === 'create' ? create(p) : join(p)); S.busy = false; if (!S.role) render(); }, 150);
    }
  },
  'send-date'() { const v = $('#dt').value; if (!v) return toast('Pick a date first.'); if (v < today()) return toast('Pick a date in the future.'); act({ date: v, stage: 'invite' }); },
  yes() { act({ stage: 'time', t: { c: '', g: '' } }); },
  no() { act({ stage: 'done', outcome: 'no', why: 'declined' }); },
  'save-time'() { const v = $('#tm').value; if (!v) return toast('Choose a time.'); act({ ['t.' + S.role]: v }); },
  'match-time'() { const v = (S.room.t || {})[other(S.role)]; if (v) act({ ['t.' + S.role]: v }); },
  'next-time'() { act({ stage: 'activity' }); },
  pick(b) { act({ act: b.dataset.k }); },
  confirm() {
    const rnd = () => String(1000 + Math.floor(Math.random() * 9000)); const a = rnd(); let b = rnd(); while (b === a) b = rnd();
    act({ stage: 'ticket', tc: a, tg: b, ci: { c: false, g: false } });
  },
  checkin() {
    const v = ($('#cc').value || '').trim(), want = S.role === 'c' ? S.room.tg : S.room.tc;
    if (v !== want) return toast('That code doesn’t match. Check the ticket.');
    act({ ['ci.' + S.role]: true });
  },
  perfect() { act({ stage: 'done', outcome: 'match' }); },
  nomatch() { act({ stage: 'done', outcome: 'no', why: 'ended' }); },
  cancel() { act({ stage: 'done', outcome: 'no', why: 'cancelled' }); },
  close() { run(() => deleteDoc(S.ref)); }
};
app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const f = H[b.dataset.a]; if (f) f(b); });

render();
if (S.role && S.code) attach();
</script>
</body>
</html>
